name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    # Windows is where LinkedNodes is developed and where its window runs. The runner has
    # git, which the history tests use, and Edge, which the viewer tests draw in.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
