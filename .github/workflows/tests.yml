name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    # Windows is where LinkedNodes is developed and where its window runs, so both ends of
    # the Python range are tried there. Every runner has git, which the history tests use,
    # and Edge or Chrome, which the viewer tests draw in: here a missing browser fails.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python: "3.10"}
          - {os: windows-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}
    env:
      LINKEDNODES_NEED_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - name: Run the tests
        shell: python
        run: |
          # Each failure is also written as an annotation, so the run's page says what broke.
          import sys, unittest
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover("tests"))
          for test, trace in result.failures + result.errors:
              print(f"::error title={test.id().split('.')[-1]}::{trace.strip().splitlines()[-1][:900]}")
          sys.exit(not result.wasSuccessful())
