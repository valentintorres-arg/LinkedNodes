[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkednodes"
version = "0.1.0"
description = "Turn a folder of code, notes, saved links and images into a knowledge graph."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["networkx>=3.0"]

[project.scripts]
linkednodes = "linkednodes.cli:main"

[tool.setuptools]
packages = ["linkednodes"]

[tool.setuptools.package-data]
linkednodes = ["viewer.html", "skill/SKILL.md"]
