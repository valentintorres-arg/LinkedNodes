[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linkednodes"
version = "0.3.0"
description = "Turn a folder of code, notes, saved links and images into a knowledge graph."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Valentín Torres" }]
requires-python = ">=3.10"
dependencies = ["networkx>=3.0"]

[project.optional-dependencies]
app = ["pywebview>=6"]  # the desktop window: pip install -e ".[app]"
build = ["pyinstaller>=6", "pillow"]  # packaging/build.py, which makes LinkedNodes.exe

[project.scripts]
linkednodes = "linkednodes.cli:main"

[tool.setuptools]
packages = ["linkednodes"]

[tool.setuptools.package-data]
linkednodes = ["viewer.html", "loading.html", "vendor/*", "skill/SKILL.md"]
