<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedNodes</title>
<style>
:root {
  --bg: #0b0c0e; --line: rgba(255, 255, 255, .12); --ink: #ffffff; --muted: #b4b7bc; --dim: #7d8187;
  --accent: #b9a8ff; --chrome: __BAR__px;  /* the room the window's title bar takes at the top */
  --sans: "Neue Haas Grotesk Text Pro", "Helvetica Neue", Helvetica, Inter, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--sans); padding-top: var(--chrome); }
main {
  height: 100%; max-width: 1080px; margin: 0 auto; padding: 0 44px; display: grid; align-items: center; gap: 28px;
  grid-template-columns: minmax(0, 1fr) minmax(340px, 420px);
}
#motif { width: 100%; max-height: calc(100vh - var(--chrome) - 48px); display: block; overflow: visible; }
#motif line { stroke: rgba(255, 255, 255, .28); stroke-width: 1; opacity: 0; }
#motif circle { stroke: var(--bg); stroke-width: 1.5; }
#motif .spark { fill: var(--accent); stroke: none; }
.label, dt, #languages span {
  font: 500 10px/1.2 var(--sans); text-transform: uppercase; letter-spacing: .11em; color: var(--dim);
}
h1 { font-size: 34px; font-weight: 400; line-height: 1.1; letter-spacing: -.02em; margin: 8px 0 6px; overflow-wrap: anywhere; }
.bad { color: #ff9c9c; }
a { color: var(--ink); text-underline-offset: 2px; }
#repo { color: var(--muted); margin: 0; min-height: 37px; overflow-wrap: anywhere; }  /* two lines, so nothing moves when it grows */
#track { height: 1px; background: var(--line); margin: 14px 0 0; }
#fill { height: 1px; width: 0; background: var(--ink); }
dl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 0; border-bottom: 1px solid var(--line); }
dl div { padding: 16px 0 14px; }
dd { margin: 0 0 4px; font-size: 26px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
dd.unknown { color: var(--dim); }
ol { list-style: none; margin: 14px 0 0; padding: 0; }
li { display: flex; align-items: center; gap: 10px; height: 28px; color: var(--dim); }
li i { flex: none; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--dim); }
li .what { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
li .found { font-variant-numeric: tabular-nums; white-space: nowrap; }
li.now { color: var(--ink); }
li.now i { background: var(--accent); border-color: var(--accent); }
li.now .found, li.done .found { color: var(--muted); }
li.done { color: var(--muted); }
li.done i { background: var(--ink); border-color: var(--ink); }
#languages { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 0; min-height: 22px; }
#languages span { color: var(--muted); border: 1px solid var(--line); padding: 4px 6px; opacity: 0; }
@media (max-width: 820px) {
  main { grid-template-columns: minmax(0, 1fr); padding: 0 28px; }
  #motif { display: none; }
}
</style>
</head>
<body>
<main>
  <svg id="motif" viewBox="0 0 520 520" aria-hidden="true"><g id="links"></g><g id="sparks"></g><g id="nodes"></g></svg>
  <section>
    <p class="label" id="doing" aria-live="polite"></p>
    <h1 id="name"></h1>
    <p id="repo"></p>
    <div id="track"><div id="fill"></div></div>
    <dl>
      <div><dd id="files" class="unknown">0</dd><dt id="t-files"></dt></div>
      <div><dd id="nodes-found" class="unknown">0</dd><dt id="t-nodes"></dt></div>
      <div><dd id="edges" class="unknown">0</dd><dt id="t-edges"></dt></div>
      <div><dd id="communities" class="unknown">0</dd><dt id="t-communities"></dt></div>
    </dl>
    <ol id="steps"></ol>
    <p id="languages"></p>
    <p><a id="back" hidden></a></p>
  </section>
</main>
<script type="application/json" id="text">__TEXT__</script>
<script type="application/json" id="state">__STATE__</script>
<script>__ANIME__</script>
<script>
(() => {
  'use strict';
  const TEXT = JSON.parse(document.getElementById('text').textContent);
  const A = window.anime || null;  // the page still says what is found if the animations cannot run
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const number = value => Number(value).toLocaleString(TEXT.locale);
  const STEPS = ['files', 'code', 'notes', 'history', 'groups', 'writing'];
  // Every animation goes through here: with reduced motion each lands at once on where it would end.
  const play = (targets, options) => A && A.animate(targets, calm ? Object.assign(options, {duration: 0, delay: 0, loop: false}) : options);

  // ---- the graph that grows beside the text: one cluster for each step, and a centre that joins them at the end
  const NS = 'http://www.w3.org/2000/svg', TINT = ['#8fb8de', '#9fd3c7', '#e6c58f', '#e39a9a', '#a7c98b'];
  let seed = 11;
  function rand() {  // seeded, so the picture is the same every time
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
  function shape(tag, into, attributes) {
    const el = document.createElementNS(NS, tag);
    for (const name in attributes) el.setAttribute(name, attributes[name]);
    $(into).append(el);
    return el;
  }
  const dot = (x, y, r, fill) => ({x, y, r, el: shape('circle', 'nodes', {cx: x, cy: y, r: 0, fill})});
  const link = (a, b) => ({a, b, el: shape('line', 'links', {x1: a.x, y1: a.y, x2: b.x, y2: b.y})});
  const clusters = [], hubs = [];
  for (let g = 0; g < 5; g++) {
    const angle = (-90 + g * 72 + (rand() - .5) * 18) * Math.PI / 180, far = 148 + rand() * 26;
    const hub = dot(260 + Math.cos(angle) * far, 260 + Math.sin(angle) * far, 7 + rand() * 3, '#ffffff');
    const cluster = {nodes: [hub], links: []}, leaves = 4 + Math.floor(rand() * 3);
    for (let l = 0; l < leaves; l++) {
      const turn = angle + ((l + .5) / leaves - .5) * 4.2 + (rand() - .5) * .4, away = 44 + rand() * 36;
      const leaf = dot(hub.x + Math.cos(turn) * away, hub.y + Math.sin(turn) * away, 3.2 + rand() * 2.4, TINT[g]);
      cluster.nodes.push(leaf);
      cluster.links.push(link(hub, leaf));
    }
    if (g) cluster.links.push(link(hubs[g - 1], hub));
    hubs.push(hub);
    clusters.push(cluster);
  }
  const heart = dot(260, 260, 13, '#b9a8ff');
  clusters.push({nodes: [heart], links: [...hubs.map(hub => link(heart, hub)), link(hubs[4], hubs[0])]});

  let grown = -1, flowing = [];
  function grow(upTo) {  // bring in every cluster up to this one; several at once follow each other
    for (let wait = 0; grown < upTo && grown < clusters.length - 1; wait += 260) {
      const cluster = clusters[++grown];
      cluster.links.forEach((line, index) => {
        if (calm) line.el.style.opacity = 1;
        play(A && A.svg.createDrawable(line.el), {
          draw: ['0 0', '0 1'], duration: 520, delay: wait + index * 45, ease: 'inOutQuad',
          onBegin: () => { line.el.style.opacity = 1; }});
      });
      cluster.nodes.forEach((node, index) => play(node.el, {
        r: [0, node.r], duration: 640, delay: wait + 140 + index * 55, ease: 'outBack(2.4)'}));
    }
  }
  function flow(cluster) {  // while a step is under way, something travels along the links it has drawn
    for (const spark of flowing) { spark.run.pause(); spark.el.remove(); }
    flowing = [];
    if (!A || calm || !cluster) return;
    flowing = cluster.links.map((line, index) => {
      const el = shape('circle', 'sparks', {class: 'spark', r: 1.8, cx: line.a.x, cy: line.a.y, opacity: 0});
      return {el, run: A.animate(el, {
        cx: [line.a.x, line.b.x], cy: [line.a.y, line.b.y], opacity: [0, 1, 1, 0],
        duration: 950, delay: 500 + index * 150, loop: true, loopDelay: 350, ease: 'inOutSine'})};
    });
  }
  function finish() {  // everything found: one wave out from the centre
    flow(null);
    const all = clusters.flatMap(cluster => cluster.nodes);
    all.forEach(node => play(node.el, {
      r: [node.r, node.r * 1.6, node.r], duration: 700, delay: Math.hypot(node.x - 260, node.y - 260) * 2.2, ease: 'outQuad'}));
    play('#links line', {stroke: ['rgba(255, 255, 255, .28)', 'rgba(255, 255, 255, .75)', 'rgba(255, 255, 255, .28)'],
                         duration: 900, delay: A && A.stagger(8), ease: 'inOutQuad'});
  }

  // ---- the text: the folder, what has been counted so far, and the steps
  const counted = {};
  function count(id, target) {
    if (target == null) return;
    const el = $(id), box = counted[id] || (counted[id] = {value: 0, aim: null});
    if (box.aim === target) return;
    box.aim = target;
    el.classList.remove('unknown');
    if (!A || calm) { box.value = target; el.textContent = number(target); return; }
    A.animate(box, {value: target, duration: 650, ease: 'outExpo',
                    onUpdate: () => { el.textContent = number(Math.round(box.value)); }});
  }
  for (const key of ['files', 'nodes', 'edges', 'communities']) $('t-' + key).textContent = TEXT[key];
  const rows = STEPS.map(step => {
    const row = document.createElement('li'), what = document.createElement('span'), found = document.createElement('span');
    what.className = 'what'; what.textContent = TEXT.steps[step];
    found.className = 'found';
    row.append(document.createElement('i'), what, found);
    $('steps').append(row);
    return {row, found};
  });
  const plural = (count, words) => `${number(count)} ${words[count === 1 ? 0 : 1]}`;
  let stage = -1, spoken = false;
  function show(state) {
    if (state.error) {  // the reading stopped; say why, and offer the way back
      flow(null);
      $('doing').textContent = TEXT.failed;
      $('doing').className = 'label bad';
      $('name').textContent = state.name || '';
      $('repo').textContent = state.error;
      if (TEXT.follow) Object.assign($('back'), {hidden: false, href: TEXT.follow.back, textContent: TEXT.back});
      return;
    }
    const at = state.step === 'done' ? STEPS.length : Math.max(0, STEPS.indexOf(state.step));
    $('doing').textContent = at === STEPS.length ? TEXT.ready : TEXT.doing;
    $('name').textContent = state.name || '';
    const history = [state.repo, state.branch, state.commits && plural(state.commits, TEXT.commits),
                     state.authors && plural(state.authors, TEXT.authors), state.since && `${TEXT.since} ${state.since}`];
    $('repo').textContent = history.filter(Boolean).join('  ·  ') || state.path || '';
    count('files', state.files);
    count('nodes-found', state.nodes);
    count('edges', state.edges);
    count('communities', state.communities);

    const kinds = state.kinds || {}, said = {
      files: state.files != null && plural(state.files, TEXT.fileWords),
      code: state.total != null && (at === 1 ? `${number(state.parsed || 0)} ${TEXT.of} ${number(state.total)}` : plural(state.total, TEXT.fileWords)),
      notes: at > 1 && [kinds.doc && plural(kinds.doc, TEXT.noteWords), kinds.image && plural(kinds.image, TEXT.imageWords),
                        state.saved && plural(state.saved, TEXT.savedWords)].filter(Boolean).join(', '),
      history: at > 3 && (state.commits ? plural(state.commits, TEXT.commits) : TEXT.noHistory),
      groups: state.communities != null && plural(state.communities, TEXT.groupWords),
    };
    rows.forEach((item, index) => {
      item.row.className = index < at ? 'done' : index === at ? 'now' : '';
      item.found.textContent = (index <= at && said[STEPS[index]]) || '';
    });
    const within = at === 1 && state.total ? (state.parsed || 0) / state.total : 0;
    play('#fill', {width: Math.min(100, (at + within) / STEPS.length * 100) + '%', duration: 500, ease: 'outQuad'});
    if (!A) $('fill').style.width = Math.min(100, (at + within) / STEPS.length * 100) + '%';

    if (state.languages && !spoken && Object.keys(state.languages).length) {
      spoken = true;
      for (const name of Object.keys(state.languages).slice(0, 8))
        $('languages').append(Object.assign(document.createElement('span'), {textContent: `${name} ${number(state.languages[name])}`}));
      if (A) play('#languages span', {opacity: [0, 1], y: [6, 0], duration: 420, delay: A.stagger(55), ease: 'outQuad'});
      else for (const chip of $('languages').children) chip.style.opacity = 1;
    }
    if (at !== stage) {
      stage = at;
      if (A) grow(Math.min(at, clusters.length - 1));
      if (at === STEPS.length) finish(); else flow(clusters[at]);
      if (A && at < STEPS.length) play(rows[at].row, {x: [-8, 0], duration: 420, ease: 'outQuad'});
    }
  }
  if (!A) $('motif').style.display = 'none';
  // The program calls this a few times a second with everything it knows so far.
  window.loading = show;
  show(JSON.parse(document.getElementById('state').textContent));
  if (A) play('section > *', {opacity: [0, 1], y: [10, 0], duration: 520, delay: A.stagger(45), ease: 'outQuad'});
  // Served by the local server, the page asks how far the reading has got, and goes back
  // to the graph once the totals have been on show for a moment.
  if (TEXT.follow) (async function follow() {
    for (;;) {
      try {
        const reply = await fetch('/api/progress', {headers: {'X-LinkedNodes-Token': TEXT.follow.token}});
        const state = (await reply.json()).state;
        show(state);
        if (state.error) return;
        if (state.step === 'done') { setTimeout(() => location.replace(TEXT.follow.back), 900); return; }
      } catch (error) { /* the server is busy; it is asked again */ }
      await new Promise(resume => setTimeout(resume, 150));
    }
  })();
})();
</script>
</body>
</html>
