<!doctype html>
<html lang="en">
<head>

<title>__TITLE__ - LinkedNodes</title>
<style>
:root {
  --bg: #0b0c0e; --panel: #1b1d20; --raised: #26292d; --line: rgba(255, 255, 255, .12);
  --border: rgba(255, 255, 255, .32); --ink: #ffffff; --muted: #b4b7bc; --dim: #7d8187;
  --paper: #ededed; --paper-ink: #17181a; --accent: #b9a8ff; --accent-soft: #b9a8ff;
  --hover: rgba(255, 255, 255, .08); --bad: #ff9c9c;
  --edge: rgba(255, 255, 255, .17); --edge-hi: rgba(255, 255, 255, .95);
  --ease: cubic-bezier(.2, .8, .2, 1); --gap: 12px; --bar: 52px; --side-w: 324px; --detail-w: 0px;
  --chrome: 0px;  /* the room the desktop window's title bar takes at the top */
  --sans: "Neue Haas Grotesk Text Pro", "Helvetica Neue", Helvetica, Inter, Arial, sans-serif;
  --mono: "Cascadia Code", "JetBrains Mono", Consolas, Menlo, monospace;
  interpolate-size: allow-keywords;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { overflow: hidden; background: var(--bg); color: var(--ink); font: 13px/1.4 var(--sans); }
body.no-side { --side-w: 0px; }
p { margin: 0 0 8px; overflow-wrap: anywhere; }
ul { list-style: none; margin: 0; padding: 0; }
a { color: var(--ink); text-underline-offset: 2px; }
.muted { color: var(--muted); }
.grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }

/* ---- the graph fills the window; a bar and two slabs float over it and never resize it */
#stage { position: fixed; inset: 0; overflow: hidden; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#bar {
  position: fixed; top: calc(var(--chrome) + var(--gap)); left: var(--gap); right: var(--gap); height: var(--bar); z-index: 5;
  display: flex; align-items: center; gap: 12px; padding: 0 20px 0 10px; background: var(--panel); border-radius: 4px;
}
#title { font-size: 17px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* The chevron sits over the panel it folds away, and turns to point at where the panel will go. */
#menu svg { width: 14px; height: 14px; display: block; margin: auto; transition: transform .34s var(--ease); }
body.no-side #menu svg { transform: rotate(180deg); }
#stats, .tag, summary, h3, .count {
  font: 500 10px/1.2 var(--sans); text-transform: uppercase; letter-spacing: .11em;
}
#stats { color: var(--dim); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
#finder { position: relative; margin-right: auto; flex: 0 1 min(400px, 40vw); min-width: 120px; }
#search {
  width: 100%; height: 32px; padding: 0 34px 0 12px; font: inherit; color: var(--ink); background: none;
  border: 1px solid var(--border); border-radius: 0;
}
#search::placeholder { color: var(--dim); }
#search:focus { outline: none; border-color: var(--ink); }
#finder kbd { position: absolute; right: 10px; top: 9px; font: 11px/14px var(--mono); color: var(--dim); pointer-events: none; }
#results {
  position: absolute; top: 40px; left: 0; right: 0; max-height: 62vh; overflow-y: auto; background: var(--panel);
  border: 1px solid var(--border); box-shadow: 0 16px 40px rgba(0, 0, 0, .6);
}
#results li.on .item { background: var(--ink); color: #000; }
#results li.on .tag { color: #000; border-color: rgba(0, 0, 0, .3); }
aside {
  position: absolute; top: calc(var(--chrome) + var(--gap) * 2 + var(--bar)); bottom: var(--gap); background: var(--panel);
  border-radius: 4px; overflow-y: auto; scrollbar-color: rgba(255, 255, 255, .25) transparent; scrollbar-width: thin;
}
#side { left: var(--gap); width: 300px; padding: 4px 18px 20px; transition: transform .34s var(--ease); }
body.no-side #side { transform: translateX(calc(-100% - 24px)); visibility: hidden; transition: transform .34s var(--ease), visibility 0s .34s; }
#detail {
  right: var(--gap); width: 360px; max-width: 92vw; padding: 20px 18px; visibility: hidden;
  transform: translateX(calc(100% + 24px)); transition: transform .34s var(--ease), width .34s var(--ease), visibility 0s .34s;
}
#detail.open { transform: none; visibility: visible; transition: transform .34s var(--ease), width .34s var(--ease); }
#detail.roomy { width: min(840px, 60vw); }
/* Wide, it takes all the room there is: up to the other panel, or to the window's edge when that one is folded away. */
#detail.wide { width: calc(100vw - max(var(--side-w), var(--gap)) - var(--gap)); max-width: none; display: flex; flex-direction: column; }
#detail.wide .ide { flex: 1 1 0; height: auto; }
#zoom {
  position: absolute; right: calc(var(--detail-w) + var(--gap)); bottom: var(--gap); display: flex; flex-direction: column;
  background: var(--panel); transition: right .34s var(--ease);
}
#zoom .btn + .btn { border-top: 0; }
#hint {
  position: absolute; left: calc(var(--side-w) + var(--gap) + 4px); bottom: 14px; color: var(--dim); font-size: 11px;
  pointer-events: none; transition: left .34s var(--ease);
}

/* ---- controls: square, outlined, white when they are the thing to press */
.btn {
  font: inherit; color: var(--ink); background: none; border: 1px solid var(--border); border-radius: 0; height: 32px;
  padding: 0 14px; cursor: pointer; white-space: nowrap; transition: background .16s, color .16s, border-color .16s;
}
.btn:hover, .btn[aria-pressed=true] { background: var(--ink); color: #000; border-color: var(--ink); }
.btn.primary { background: var(--ink); color: #000; border-color: var(--ink); }
.btn.primary:hover { background: #cfcfcf; border-color: #cfcfcf; }
.btn.icon { width: 32px; padding: 0; font-size: 15px; }
.buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 2px; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.tag { color: var(--muted); padding: 4px 6px; border: 1px solid var(--line); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; height: 26px; padding: 0 9px; border: 0; cursor: pointer; display: inline-flex; align-items: center;
  gap: 7px; background: var(--paper); color: var(--paper-ink); transition: background .16s, color .16s, box-shadow .16s;
}
.chip:hover { background: #fff; }
.chip .count { opacity: .55; letter-spacing: .04em; }
.chip[aria-pressed=false] { background: none; color: var(--dim); box-shadow: inset 0 0 0 1px var(--line); }
.chip[aria-pressed=false]:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--border); }
details { border-bottom: 1px solid var(--line); }
details::details-content { height: 0; overflow: clip; transition: height .3s var(--ease), content-visibility .3s allow-discrete; }
details[open]::details-content { height: auto; }
summary { cursor: pointer; list-style: none; display: flex; align-items: center; padding: 16px 0; color: var(--ink); }
summary::-webkit-details-marker { display: none; }
summary::after {  /* a plus that turns into a minus */
  content: ""; margin-left: auto; width: 9px; height: 9px; transition: transform .3s var(--ease);
  background: linear-gradient(var(--ink), var(--ink)) center / 100% 1px no-repeat, linear-gradient(var(--ink), var(--ink)) center / 1px 100% no-repeat;
}
details[open] > summary::after { transform: rotate(180deg); background-size: 100% 1px, 1px 0; }
details > div { padding-bottom: 16px; }
h3 { color: var(--dim); margin: 18px 0 8px; }
details h3:first-child { margin-top: 0; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; align-items: baseline; padding: 8px 0 0; }
.row output { font: 11px/1 var(--mono); color: var(--dim); }
.row input { grid-column: 1 / -1; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; margin: 0; background: none; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track {
  height: 1px; background: linear-gradient(to right, var(--ink) var(--fill, 0%), var(--border) var(--fill, 0%));
}
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 9px; margin-top: -4px; background: var(--ink); }
input[type=range]::-moz-range-track { height: 1px; background: var(--border); }
input[type=range]::-moz-range-progress { height: 1px; background: var(--ink); }
input[type=range]::-moz-range-thumb { width: 9px; height: 9px; border: 0; border-radius: 0; background: var(--ink); }
.check { display: flex; gap: 10px; align-items: center; padding: 5px 0; cursor: pointer; }
.check input {
  -webkit-appearance: none; appearance: none; width: 14px; height: 14px; margin: 0; border: 1px solid var(--border);
  display: grid; place-content: center; cursor: pointer; transition: background .16s;
}
.check input:checked { background: var(--ink); border-color: var(--ink); }
.check input:checked::after { content: ""; width: 6px; height: 6px; background: #000; }
select, .field, textarea { font: inherit; color: var(--ink); background: none; border: 1px solid var(--border); border-radius: 0; }
select { height: 28px; padding: 0 6px; margin-left: auto; background: var(--panel); }
.field, textarea { width: 100%; padding: 8px 10px; display: block; }
.field:focus, textarea:focus { outline: none; border-color: var(--ink); }
textarea { resize: vertical; min-height: 260px; line-height: 1.5; }
.item {
  font: inherit; color: inherit; background: none; border: 0; padding: 8px 6px; width: 100%; text-align: left;
  cursor: pointer; display: flex; gap: 10px; align-items: center; transition: background .16s;
}
.item:hover { background: var(--hover); }
.item[aria-pressed=true] { background: var(--ink); color: #000; }
.item[aria-pressed=true] .count { color: #000; }
.item .count { color: var(--dim); }
li + li > .item { box-shadow: inset 0 1px 0 var(--line); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.stack { display: block; margin-bottom: 12px; }
.stack > span { display: block; margin-bottom: 6px; color: var(--muted); }
.status { min-height: 1.45em; margin-top: 8px; color: var(--muted); }
.status.bad { color: var(--bad); }
#git .status { white-space: pre-wrap; overflow-wrap: anywhere; }
.pair { display: flex; align-items: center; gap: 4px; }
.pair .item, .pair .field { flex: 1; width: auto; min-width: 0; }
.item[aria-pressed=true] .tag { color: #000; border-color: rgba(0, 0, 0, .3); }
.btn.small { width: 24px; height: 24px; padding: 0; flex: none; }
.btn:disabled { opacity: .4; pointer-events: none; }
h3.split { display: flex; align-items: baseline; gap: 8px; }
.link {
  font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--muted); background: none; border: 0;
  padding: 0; margin-left: auto; cursor: pointer;
}
.link:hover { color: var(--ink); }
textarea.short { min-height: 64px; height: 64px; }
#git select { max-width: 190px; }

/* ---- detail panel */
#close { position: absolute; top: 14px; right: 14px; }
h2 { font-size: 26px; font-weight: 400; line-height: 1.1; letter-spacing: -.02em; margin: 0 44px 14px 0; overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.path { font: 11.5px/1.4 var(--mono); color: var(--dim); }
.tabs { display: flex; gap: 20px; margin: 16px 0; border-bottom: 1px solid var(--line); }
.tab {
  font: inherit; color: var(--dim); background: none; border: 0; padding: 8px 0 10px; margin-bottom: -1px; cursor: pointer;
  border-bottom: 1px solid transparent; transition: color .16s, border-color .16s;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected=true] { color: var(--ink); border-bottom-color: var(--ink); }
.md h3, .md h4 { color: var(--ink); font: 400 18px/1.2 var(--sans); text-transform: none; letter-spacing: -.01em; margin: 18px 0 8px; }
.md h4 { font-size: 15px; }
.md ul, .md ol { list-style: revert; padding-left: 22px; margin: 0 0 8px; }
.md pre { background: var(--bg); padding: 10px 12px; overflow: auto; margin: 0 0 8px; }
.md code { font: 12px/1.5 var(--mono); background: var(--bg); padding: 1px 4px; }
.md pre code { padding: 0; }

/* ---- code editor, in the colours of Visual Studio Code's Dark+ theme */
.ide {
  --ide-bg: #1e1e1e; --ide-fg: #d4d4d4; display: flex; flex-direction: column; height: calc(100vh - 360px - var(--chrome));
  min-height: 260px; overflow: hidden; box-shadow: 0 0 0 1px #3c3c3c; background: var(--ide-bg);
}
.ide-tabs { display: flex; background: #252526; flex: none; }
.ide-tab {
  display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 34px; background: var(--ide-bg);
  color: #fff; box-shadow: inset 0 1px 0 #007acc; font: 13px "Segoe UI", system-ui, sans-serif;
}
.ide-lang { font: 700 9.5px/1 var(--mono); color: #3794ff; letter-spacing: .02em; }
.ide-dot { width: 8px; height: 8px; border-radius: 50%; }
.ide-dot.on { background: #c5c5c5; }
.ide-wide { position: relative; margin-left: auto; width: 34px; height: 34px; padding: 0; border: 0; background: none; cursor: pointer; }
.ide-wide:hover { background: rgba(255, 255, 255, .1); }
/* two corners that point outwards, and inwards once the editor is wide */
.ide-wide::before, .ide-wide::after { content: ""; position: absolute; width: 5px; height: 5px; border: 0 solid #c5c5c5; }
.ide-wide::before { top: 11px; right: 11px; border-width: 1.5px 1.5px 0 0; }
.ide-wide::after { bottom: 11px; left: 11px; border-width: 0 0 1.5px 1.5px; }
.ide-wide[aria-pressed=true]::before { top: 9px; right: 9px; border-width: 0 0 1.5px 1.5px; }
.ide-wide[aria-pressed=true]::after { bottom: 9px; left: 9px; border-width: 1.5px 1.5px 0 0; }
.ide-crumbs {
  flex: none; padding: 3px 14px 4px; font: 12px "Segoe UI", system-ui, sans-serif; color: #a0a0a0; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.ide-crumbs b { color: #dcdcaa; font-weight: 400; }
.ide-body { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: auto 1fr; overflow: hidden; }
.ide-band { position: absolute; left: 0; right: 0; top: 0; height: 20px; background: rgba(255, 255, 255, .045); pointer-events: none; }
.ide-mark { position: absolute; left: 0; top: 0; width: 3px; height: 20px; background: #dcdcaa; pointer-events: none; }
.ide-gutter, .ide-paint, .ide-text { font: 13px/20px var(--mono); tab-size: 2; margin: 0; }
.ide-gutter { padding: 8px 14px 8px 16px; text-align: right; color: #858585; overflow: hidden; user-select: none; position: relative; }
.ide-wrap { position: relative; min-width: 0; }
.ide-paint, .ide-text { position: absolute; inset: 0; padding: 8px 12px 8px 4px; white-space: pre; border: 0; }
.ide-paint { overflow: hidden; color: var(--ide-fg); pointer-events: none; }
.ide-text {
  width: 100%; height: 100%; min-height: 0; overflow: auto; resize: none; background: transparent;
  color: transparent; -webkit-text-fill-color: transparent; caret-color: #aeafad; scrollbar-color: #4f4f4f transparent;
}
.ide-text:focus, .ide-text:focus-visible { outline: none; }
.ide-text::selection { background: rgba(38, 79, 120, .7); }
.ide-status {
  flex: none; display: flex; gap: 16px; align-items: center; height: 22px; padding: 0 12px; background: #007acc;
  color: #fff; font: 12px "Segoe UI", system-ui, sans-serif; white-space: nowrap;
}
.ide-git { font: 700 11px/1 var(--mono); }
.ide-changes { position: absolute; left: 5px; top: 0; width: 3px; pointer-events: none; }
.ide-changes i { position: absolute; left: 0; width: 3px; background: #1b81a8; }
.ide-diff {
  flex: 1; min-height: 0; margin: 0; overflow: auto; padding: 8px 0; font: 13px/20px var(--mono);
  color: var(--ide-fg); tab-size: 2;
}
.ide-diff span { display: block; padding: 0 14px; white-space: pre; min-width: max-content; }
.ide-diff .add { background: rgba(46, 160, 67, .22); }
.ide-diff .del { background: rgba(248, 81, 73, .2); }
.ide-diff .hunk { color: #569cd6; }
.ide-diff .meta { color: #858585; }
.ide .k { color: #569cd6; } .ide .k2 { color: #c586c0; } .ide .s { color: #ce9178; } .ide .n { color: #b5cea8; }
.ide .c { color: #6a9955; } .ide .f { color: #dcdcaa; } .ide .t { color: #4ec9b0; } .ide .v { color: #9cdcfe; }
.ide .o { color: #4fc1ff; } .ide .h { color: #569cd6; font-weight: 700; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 760px) {
  #stats, #hint { display: none; } #side { width: min(300px, 80vw); }
  #detail.wide { width: calc(100vw - var(--gap) * 2); }
}
</style>
</head>

      ctx.lineWidth = 1.3 * S.linkWidth / k;
      for (const e of activeEdges) {
        if (e.s !== focus && e.t !== focus) continue;
        ctx.setLineDash(e.confidence === 'EXTRACTED' ? [] : [5 / k, 4 / k]);
        ctx.beginPath(); ctx.moveTo(e.s.x, e.s.y); ctx.lineTo(e.t.x, e.t.y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath(); arrowHead(e); ctx.fill();
      }
    }

    for (const n of active) {
      ctx.globalAlpha = faded(n) ? dim : 1;
      ctx.fillStyle = n.color;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = theme.bg; ctx.lineWidth = 1 / k; ctx.stroke();  // keeps touching nodes apart
      if (n === selected || (lit && lit.has(n) && !focus)) {
        ctx.strokeStyle = n === selected ? theme.ink : theme['accent-soft'];
        ctx.lineWidth = 2 / k;
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 2.5 / k, 0, 6.2832); ctx.stroke();
      }
      if (n.doc) {  // a square corner marks the nodes somebody has documented
        const side = Math.max(3 / k, n.r * .7);
        ctx.fillStyle = theme.ink;
        ctx.fillRect(n.x + n.r * .55, n.y - n.r * .55 - side, side, side);

    // that would cover one already drawn is left out.
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.lineJoin = 'round';
    const floor = S.labels <= 0 ? Infinity : 18 * (1 - S.labels);
    const wanted = [];
    for (const n of active) {
      const sx = n.x * k + view.x, sy = n.y * k + view.y, sr = n.r * k;
      if (sx < -200 || sx > w + 20 || sy < -20 || sy > h + 20 || (faded(n) && n !== focus)) continue;
      const forced = n === focus || n === selected;

      if (item.rank < 1e9 && boxes.some(b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) continue;

      ctx.fillStyle = item.rank >= 1e9 ? theme.ink : theme.muted; ctx.fillText(text, x, item.sy);
    }
  }

  // ---- pointer
  let panning = false, moved = 0, last = null;
  function at(event) {
    const box = canvas.getBoundingClientRect();
    const x = (event.clientX - box.left - view.x) / view.k, y = (event.clientY - box.top - view.y) / view.k;
    for (let i = active.length - 1; i >= 0; i--) {
      const n = active[i];
      if (Math.hypot(n.x - x, n.y - y) <= n.r + 4 / view.k) return n;
    }
    return null;
  }
  canvas.addEventListener('pointerdown', event => {
    canvas.setPointerCapture(event.pointerId);
    aim = null;
    dragging = at(event);
    panning = !dragging;
    moved = 0;
    last = {x: event.clientX, y: event.clientY};
  });
  canvas.addEventListener('pointermove', event => {
    if (!last) {
      const found = at(event);
      if (found !== hover) { hover = found; dirty = true; canvas.style.cursor = found ? 'pointer' : 'default'; }
      return;
    }
    const dx = event.clientX - last.x, dy = event.clientY - last.y;
    moved += Math.abs(dx) + Math.abs(dy);
    last = {x: event.clientX, y: event.clientY};
    if (dragging) {
      dragging.x += dx / view.k; dragging.y += dy / view.k;
      if (!still) alpha = Math.max(alpha, .15);
    } else if (panning) {
      view.x += dx; view.y += dy;
    }
    dirty = true;
  });
  canvas.addEventListener('pointerup', event => {
    if (moved < 5) select(at(event));
    dragging = null; panning = false; last = null;
  });
  canvas.addEventListener('pointerleave', () => { if (!last && hover) { hover = null; dirty = true; } });
  canvas.addEventListener('wheel', event => {
    event.preventDefault();
    const box = canvas.getBoundingClientRect();
    aim = null;
    zoom(Math.exp(-event.deltaY * .0015), event.clientX - box.left, event.clientY - box.top);
  }, {passive: false});

  // ---- selection and the detail panel
  function neighbourhood(root, depth) {
    const found = new Set([root]);
    let rim = [root];
    for (let step = 0; step < depth; step++) {
      const next = [];
      for (const n of rim) for (const {other} of n.links) if (!found.has(other)) { found.add(other); next.push(other); }
      rim = next;
    }
    return found;
  }
  function select(n, centre) {
    const diffOpen = gitView;
    gitView = null;  // a node and a diff share the panel
    if (diffOpen) renderGit();
    selected = n;
    if (!n) hops = 0;
    const before = local;
    local = n && hops ? neighbourhood(n, hops) : null;
    if (local || before) refilter();
    renderDetail();
    if (local) setTimeout(fit, still ? 0 : 450);
    else if (n) bringIntoView(n, centre);
    dirty = true;
  }
  function nodeButton(n, note) {
    return el('button', {className: 'item', onclick: () => select(n, true)},
      el('span', {className: 'dot', style: 'background:' + n.color}),
      el('span', {className: 'grow', textContent: n.label}),
      el('span', {className: 'tag', textContent: note || kindName(n.kind)}));
  }
  const drafts = new Map();  // unsaved text per node, kept while moving around the graph

    draft.note !== undefined || (draft.source && draft.source.editable && draft.code !== draft.source.text));
  let tab = 'links', tabButtons = {};

  function markTabs(n) {

    for (const id in tabButtons) tabButtons[id].textContent = tabButtons[id].dataset.name + (pending[id] ? ` (${TEXT.unsaved})` : '');
  }

    }
    if (!selected) return diffPanel(panel);
    const n = selected;
    const tabs = [['links', TEXT.tabLinks, linksTab], ['note', TEXT.tabNote, noteTab]];
    if (EDIT) tabs.push(['props', TEXT.tabProps, propsTab]);
    if (EDIT && n.source_file && (n.family === 'code' || n.family === 'notes')) tabs.push(['code', TEXT.tabCode, codeTab]);
    if (!tabs.some(item => item[0] === tab)) tab = 'links';
    panel.classList.toggle('roomy', tab === 'note' || tab === 'code');
    panel.classList.toggle('wide', wide && tab === 'code');
    stage.style.setProperty('--detail-w', seen().right + 'px');  // the zoom buttons step aside

    panel.replaceChildren();
    const facts = el('div', {className: 'facts'}, el('span', {className: 'tag', textContent: kindName(n.kind)}));
    if (n.community != null) facts.append(el('span', {className: 'tag', textContent: communityLabel.get(n.community)}));
    if (n.edited) facts.append(el('span', {className: 'tag', textContent: SPANISH ? 'corregido' : 'edited'}));
    if (gitChanged.has(n)) facts.append(el('span', {className: 'tag', style: `color:${CHANGED};border-color:${CHANGED}`,
                                               textContent: TEXT[gitChanged.get(n)] || gitChanged.get(n)}));
    panel.append(
      el('button', {id: 'close', className: 'btn icon', textContent: '×', title: TEXT.close, onclick: () => select(null)}),
      el('h2', {textContent: n.label}), facts);
    if (n.source_file) panel.append(el('p', {className: 'path', textContent: n.source_file + (n.line ? ':' + n.line : '')}));
    const past = GIT && GIT.files && GIT.files[n.source_file];
    if (past) panel.append(el('p', {className: 'path',
      textContent: `${TEXT.lastChange}: ${past.last}, ${past.author}, ${past.commits} commits`, title: past.subject}));
    if (n.url && /^https?:\/\//i.test(n.url))
      panel.append(el('p', null, el('a', {href: n.url, target: '_blank', rel: 'noopener noreferrer', textContent: n.url})));
    for (const key of ['summary', 'note']) if (n[key]) panel.append(el('p', {textContent: n[key]}));

    const bar = el('div', {className: 'tabs'});
    bar.setAttribute('role', 'tablist');
    tabButtons = {};
    for (const [id, name] of tabs) {
      const button = el('button', {className: 'tab', onclick: () => { tab = id; renderDetail(); bringIntoView(n); }});
      button.dataset.name = name;

  }

  function linksTab(panel, n) {
    const choices = el('div', {className: 'buttons'},
      el('button', {className: 'btn', textContent: TEXT.centerOn, onclick: () => bringIntoView(n, true)}));
    for (const [depth, name] of [[0, TEXT.all], [1, TEXT.hop1], [2, TEXT.hop2]]) {

      const key = (item.out ? '→ ' : '← ') + item.link.relation.replace(/_/g, ' ');
      if (!byRelation.has(key)) byRelation.set(key, []);
      byRelation.get(key).push(item);

    for (const [relation, items] of [...byRelation].sort((a, b) => a[0].slice(2).localeCompare(b[0].slice(2)))) {

      const list = el('ul');

      panel.append(list);
    }
    panel.append(el('p', {className: 'muted', style: 'margin-top:16px', textContent: TEXT.solid}));
  }

  // ---- editing: a note per node, its properties, and the file it comes from
  async function api(method, path, body) {
    const response = await fetch(path, {
      method, headers: {'Content-Type': 'application/json', 'X-LinkedNodes-Token': EDIT.token},
      body: body ? JSON.stringify(body) : undefined,

    const reply = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(reply.error || response.statusText);
    return reply;
  }
  const action = (name, run, primary) => el('button', {className: primary ? 'btn primary' : 'btn', textContent: name, onclick: run});
  function saveKey(area, run) {

    });

    while ((match = pattern.exec(text))) {
      if (match.index > from) parent.append(text.slice(from, match.index));
      const token = match[0];
      if (token[0] === '`') parent.append(el('code', {textContent: token.slice(1, -1)}));
      else if (token.startsWith('**')) parent.append(el('strong', {textContent: token.slice(2, -2)}));
      else if (token[0] === '*') parent.append(el('em', {textContent: token.slice(1, -1)}));
      else {
        const parts = token.match(/^\[([^\]]+)\]\((.+)\)$/);
        parent.append(el('a', {href: parts[2], target: '_blank', rel: 'noopener noreferrer', textContent: parts[1]}));
      }
      from = pattern.lastIndex;
    }
    if (from < text.length) parent.append(text.slice(from));
  }
  function markdown(text) {  // a small, safe subset: headings, lists, code, emphasis, links
    const root = el('div', {className: 'md'});
    let list = null, lines = [], code = null;
    const flush = () => {
      if (lines.length) { const p = el('p'); inline(p, lines.join(' ')); root.append(p); lines = []; }
    };
    for (const line of text.split('\n')) {
      const fence = line.trim().startsWith('```');
      if (code) {
        if (fence) { root.append(el('pre', null, el('code', {textContent: code.join('\n')}))); code = null; }
        else code.push(line);

      }
      const heading = line.match(/^(#{1,4})\s+(.*)$/), item = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/);
      if (fence) { flush(); list = null; code = []; }

        inline(h, heading[2]);

        const entry = el('li');
        inline(entry, item[1]);

      } else if (!line.trim()) { flush(); list = null; }
      else { list = null; lines.push(line.trim()); }

  function noteTab(panel, n) {
    const draft = drafts.get(n.id) || {};
    if (EDIT && draft.note !== undefined) {
      const area = el('textarea', {value: draft.note, placeholder: TEXT.notePlaceholder});
      const status = el('p', {className: 'status'});
      const save = async () => {
        report(status, TEXT.saving);
        try {
          n.doc = (await api('PUT', '/api/note', {id: n.id, text: area.value})).doc || undefined;
          delete draft.note;
          if (notedOnly) refilter();

        if (stamp && reply.stamp !== stamp) await follow();
        stamp = reply.stamp;
      } catch (error) { await new Promise(resume => setTimeout(resume, 4000)); }
    }
  }

  // ---- search, in the top bar
  const search = $('search'), results = $('results');
  let found = [], cursor = 0;
  function runSearch() {
    const needle = fold(search.value.trim());
    results.replaceChildren();
    found = []; cursor = 0;
    results.hidden = !needle;
    if (!needle) { lit = null; dirty = true; return; }
    const scored = [];
    for (const n of nodes) {
      const score = n.key === needle ? 4 : n.key.startsWith(needle) ? 3 : n.key.includes(needle) ? 2
        : n.where.includes(needle) ? 1 : 0;
      if (score) scored.push([score, n]);
    }
    scored.sort((a, b) => b[0] - a[0] || (b[1].degree || 0) - (a[1].degree || 0));
    lit = new Set(scored.filter(item => item[0] > 1).map(item => item[1]));
    found = scored.slice(0, 14).map(item => item[1]);
    found.forEach((n, index) => results.append(el('li', {className: index ? '' : 'on'}, nodeButton(n))));
    if (!found.length) results.append(el('li', {className: 'muted', style: 'padding:6px', textContent: TEXT.noMatches}));
    dirty = true;
  }
  search.placeholder = TEXT.search;
  search.setAttribute('aria-label', TEXT.search);
  search.addEventListener('input', runSearch);
  search.addEventListener('focus', () => { results.hidden = !search.value.trim(); });
  search.addEventListener('blur', () => setTimeout(() => { results.hidden = true; }, 180));
  search.addEventListener('keydown', event => {
    const rows = results.children;
    if (event.key === 'Enter' && found[cursor]) { select(found[cursor], true); results.hidden = true; }
    else if ((event.key === 'ArrowDown' || event.key === 'ArrowUp') && found.length) {
      event.preventDefault();
      results.hidden = false;
      rows[cursor].className = '';
      cursor = (cursor + (event.key === 'ArrowDown' ? 1 : found.length - 1)) % found.length;
      rows[cursor].className = 'on';
    } else if (event.key === 'Escape') { search.value = ''; runSearch(); search.blur(); }
  });
  document.addEventListener('keydown', event => {
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(event.target.tagName || '');
    if (event.key === '/' && !typing) { event.preventDefault(); search.focus(); search.select(); }
    else if (event.key === 'Escape' && !typing) select(null);
  });

  // ---- the panel of controls
  const refreshers = [];
  function slider(parent, key, min, max, step, changed) {
    const input = el('input', {type: 'range', min, max, step});
    const value = el('output');
    const show = () => {
      input.value = S[key];
      input.style.setProperty('--fill', (S[key] - min) / (max - min) * 100 + '%');
      value.textContent = step < 1 ? Math.round(S[key] * 100) + '%' : S[key];
    };
    input.addEventListener('input', () => { S[key] = +input.value; show(); keep(); changed(); });
    refreshers.push(show);
    parent.append(el('label', {className: 'row'}, el('span', {textContent: TEXT[key]}), value, input));
    show();
  }
  function toggle(parent, key, changed) {
    const input = el('input', {type: 'checkbox'});
    const show = () => { input.checked = S[key]; };
    input.addEventListener('change', () => { S[key] = input.checked; keep(); changed(); });
    refreshers.push(show);
    parent.append(el('label', {className: 'check'}, input, el('span', {textContent: TEXT[key]})));
    show();
  }
  const redraw = () => { dirty = true; };

  for (const [id, key] of [['h-filters', 'filters'], ['h-groups', 'groups'], ['h-git', 'git'], ['h-display', 'display'], ['h-forces', 'forces']])
    $(id).textContent = TEXT[key];

  const filters = $('filters');
  filters.append(el('h3', {textContent: TEXT.kinds}));
  const kinds = new Map();
  for (const n of nodes) kinds.set(n.kind, (kinds.get(n.kind) || 0) + 1);
  const kindOptions = el('datalist', {id: 'kind-options'}), kindChips = el('div', {className: 'chips'});
  filters.append(kindChips);
  for (const [kind, count] of [...kinds].sort((a, b) => b[1] - a[1])) {
    const chip = el('button', {className: 'chip', onclick: () => {
      const on = hiddenKinds.delete(kind);
      if (!on) hiddenKinds.add(kind);
      chip.setAttribute('aria-pressed', String(on));
      refilter();
    }}, el('span', {textContent: kindName(kind)}), el('span', {className: 'count', textContent: number(count)}));
    chip.setAttribute('aria-pressed', 'true');
    kindChips.append(chip);
    kindOptions.append(el('option', {value: kind}));
  }
  slider(filters, 'minDegree', 0, 12, 1, refilter);
  toggle(filters, 'inferred', refilter);
  const noted = el('input', {type: 'checkbox'});
  noted.addEventListener('change', () => { notedOnly = noted.checked; refilter(); });
  filters.append(el('label', {className: 'check'}, noted, el('span', {textContent: TEXT.notedOnly})), kindOptions);

  const groups = $('groups');
  const colorBy = el('select', null, el('option', {value: 'community', textContent: TEXT.byCommunity}),
    el('option', {value: 'kind', textContent: TEXT.byKind}));
  if (GIT && GIT.files && Object.keys(GIT.files).length)
    colorBy.append(el('option', {value: 'commits', textContent: TEXT.byCommits}),
      el('option', {value: 'recency', textContent: TEXT.byRecency}));
  else if (S.colorBy === 'commits' || S.colorBy === 'recency') S.colorBy = 'community';
  colorBy.addEventListener('change', () => { S.colorBy = colorBy.value; keep(); recolor(); });
  refreshers.push(() => { colorBy.value = S.colorBy; });
  colorBy.value = S.colorBy;
  groups.append(el('label', {className: 'check'}, el('span', {textContent: TEXT.colorBy}), colorBy),
    el('h3', {textContent: TEXT.communities}));
  const communityList = el('ul');
  for (const c of DATA.communities) {
    const button = el('button', {className: 'item', onclick: () => {
      isolated = isolated === c.id ? null : c.id;
      for (const other of communityList.querySelectorAll('button'))
        other.setAttribute('aria-pressed', String(other === button && isolated != null));
      refilter();
      setTimeout(fit, still ? 0 : 450);
    }}, el('span', {className: 'dot', style: 'background:' + communityColor(c.id)}),
       el('span', {className: 'grow', textContent: c.label}),
       el('span', {className: 'count', textContent: number(c.size)}));
    button.setAttribute('aria-pressed', 'false');
    communityList.append(el('li', null, button));
  }
  groups.append(communityList);

  const display = $('display');
  slider(display, 'labels', 0, 1, .01, redraw);
  slider(display, 'nodeSize', .3, 3, .01, resizeNodes);
  slider(display, 'linkWidth', .2, 4, .01, redraw);
  toggle(display, 'arrows', redraw);

  const forces = $('forces');
  slider(forces, 'center', 0, 1, .01, reheat);
  slider(forces, 'repel', 0, 1, .01, reheat);
  slider(forces, 'link', 0, 1, .01, reheat);
  slider(forces, 'distance', 20, 300, 1, reheat);
  forces.append(el('div', {className: 'buttons'},
    el('button', {className: 'btn', textContent: TEXT.relayout, onclick: () => {
      scatter(); alpha = 1; reheat(); setTimeout(fit, still ? 0 : 900);
    }}),
    el('button', {className: 'btn', textContent: TEXT.reset, onclick: () => {
      Object.assign(S, DEFAULTS); keep();
      for (const show of refreshers) show();
      resizeNodes(); recolor(); refilter();
    }})));

  const menu = $('menu');
  menu.title = TEXT.panel;
  menu.setAttribute('aria-label', TEXT.panel);
  menu.addEventListener('click', () => {
    // The graph slides along with the panel, so what was in view stays in view.
    const before = seen().middle, from = aim || view;
    menu.setAttribute('aria-expanded', String(!document.body.classList.toggle('no-side')));
    stage.style.setProperty('--detail-w', seen().right + 'px');  // a wide editor grows into the room the panel left
    glide(from.x + seen().middle - before, from.y, from.k);
  });
  if (innerWidth < 760) document.body.classList.add('no-side');
  menu.setAttribute('aria-expanded', String(!document.body.classList.contains('no-side')));
  const centreOfView = () => { const area = seen(); return [area.middle, area.centre]; };
  for (const [glyph, name, run] of [['+', TEXT.zoomIn, () => zoom(1.4, ...centreOfView(), true)],
                                    ['−', TEXT.zoomOut, () => zoom(1 / 1.4, ...centreOfView(), true)],
                                    ['⤢', TEXT.fit, () => fit()]]) {
    const button = el('button', {className: 'btn', textContent: glyph, title: name, onclick: run});
    button.setAttribute('aria-label', name);
    $('zoom').append(button);
  }
  $('title').textContent = DATA.title;
  $('hint').textContent = TEXT.hint;

  // ---- start
  readTheme();
  resizeNodes();
  recolor();
  applyGit();
  refreshGit();  // with a server behind the page, show the working tree as it is now
  if (EDIT) watch();
  scatter();
  owed = 300;  // set before the first filter, which would otherwise lay the graph out by itself
  refilter();
  alpha = 1;
  settle(250);
  new ResizeObserver(resize).observe(canvas);
  resize();
  fit(true);
  const framed = Object.assign({}, view);
  (function frame() {
    if (owed) {
      settle(12);
      // Once it has settled the camera frames it again, unless it has been moved meanwhile.
      if (!owed && !aim && view.x === framed.x && view.y === framed.y && view.k === framed.k) fit();
    } else if (alpha > .02) { tick(); dirty = true; }
    if (aim) {  // ease the camera towards where it was asked to go
      view.x += (aim.x - view.x) * .2; view.y += (aim.y - view.y) * .2; view.k += (aim.k - view.k) * .2;
      if (Math.abs(aim.x - view.x) < .5 && Math.abs(aim.y - view.y) < .5 && Math.abs(aim.k - view.k) < .002) {
        Object.assign(view, aim);
        aim = null;
      }
      dirty = true;
    }
    if (dirty) { dirty = false; draw(); }
    requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
